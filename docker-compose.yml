services:
  backend:
    build: ./backend
    container_name: vul-scan-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./backend/vul.db:/app/vul.db
      - ./backend/reports:/app/reports

  frontend:
    build: ./frontend
    container_name: vul-scan-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
